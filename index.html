<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tameria 1337 | İnfazhane</title>

    <!-- Sekme Logosu -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* =========================
           ARKA PLAN
        ========================= */

        .bg-fixed-img {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            z-index: 0;
            pointer-events: none;
            user-select: none;
        }

        .overlay {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.65)
                );

            z-index: 1;
            pointer-events: none;
        }

        /* =========================
           ANA KONTEYNER
        ========================= */

        .container {
            position: relative;
            z-index: 2;

            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 35px 20px 40px;

            text-align: center;
        }

        /* =========================
           HEADER
        ========================= */

        .header-content {
            width: 100%;
            max-width: 700px;

            margin-bottom: 20px;
        }

        /* LOGO */

        .site-logo {
            width: 210px;
            max-width: 70vw;
            height: auto;

            display: block;

            margin: 0 auto 15px;

            filter:
                drop-shadow(0 0 5px rgba(255, 0, 0, 1))
                drop-shadow(0 0 15px rgba(255, 0, 0, 0.8))
                drop-shadow(0 0 30px rgba(255, 0, 0, 0.55));

            transition:
                transform 0.3s ease,
                filter 0.3s ease;
        }

        .site-logo:hover {
            transform: scale(1.05);

            filter:
                drop-shadow(0 0 8px rgba(255, 0, 0, 1))
                drop-shadow(0 0 20px rgba(255, 0, 0, 0.95))
                drop-shadow(0 0 40px rgba(255, 0, 0, 0.75));
        }

        /* =========================
           BAŞLIK
        ========================= */

        h1 {
            font-size: 3.2rem;

            text-transform: uppercase;

            letter-spacing: 6px;

            color: #ff1a1a;

            font-weight: 900;

            text-shadow:
                0 0 10px rgba(255, 0, 0, 0.9),
                0 0 25px rgba(255, 0, 0, 0.8),
                0 0 50px rgba(255, 0, 0, 0.5),
                0 0 70px rgba(0, 0, 0, 1);

            margin-bottom: 5px;
        }

        .slogan {
            font-size: 1.05rem;

            color: #eee;

            letter-spacing: 2px;

            font-weight: 700;

            text-shadow:
                0 2px 8px #000,
                0 0 10px rgba(0, 0, 0, 1);

            margin-bottom: 8px;
        }

        .sub-title {
            font-size: 0.9rem;

            color: #ff3333;

            letter-spacing: 5px;

            text-transform: uppercase;

            font-weight: 900;

            text-shadow:
                0 0 8px rgba(255, 0, 0, 0.8),
                0 0 20px rgba(255, 0, 0, 0.5);
        }

        /* =========================
           FORM
        ========================= */

        .form-container {
            width: 100%;
            max-width: 500px;

            background: rgba(5, 5, 5, 0.82);

            border: 1px solid #ff1a1a;

            border-radius: 8px;

            padding: 28px 30px;

            box-shadow:
                0 0 15px rgba(255, 0, 0, 0.35),
                0 0 40px rgba(255, 0, 0, 0.2),
                inset 0 0 20px rgba(255, 0, 0, 0.08);

            backdrop-filter: blur(7px);

            margin-bottom: 18px;
        }

        .form-container h2 {
            color: #ff3333;

            font-size: 1.15rem;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 20px;

            text-shadow:
                0 0 10px rgba(255, 0, 0, 0.6);
        }

        .form-group {
            margin-bottom: 16px;

            text-align: left;
        }

        .form-group label {
            display: block;

            color: #bbb;

            font-size: 0.75rem;

            text-transform: uppercase;

            letter-spacing: 1px;

            font-weight: 700;

            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 12px;

            background: rgba(8, 8, 8, 0.95);

            border: 1px solid #3d1111;

            border-radius: 5px;

            color: #fff;

            font-size: 0.9rem;

            outline: none;

            resize: vertical;

            transition: 0.3s ease;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #666;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #ff1a1a;

            box-shadow:
                0 0 8px rgba(255, 0, 0, 0.5),
                inset 0 0 8px rgba(255, 0, 0, 0.05);

            background: rgba(15, 5, 5, 0.98);
        }

        /* =========================
           GÖNDER BUTONU
        ========================= */

        .submit-btn {
            width: 100%;

            padding: 13px;

            margin-top: 5px;

            background:
                linear-gradient(
                    to bottom,
                    #8b0000,
                    #3a0000
                );

            border: 1px solid #ff1a1a;

            border-radius: 5px;

            color: #fff;

            font-size: 0.9rem;

            font-weight: 900;

            letter-spacing: 2px;

            text-transform: uppercase;

            cursor: pointer;

            box-shadow:
                0 0 12px rgba(255, 0, 0, 0.35);

            transition: 0.3s ease;
        }

        .submit-btn:hover {
            background:
                linear-gradient(
                    to bottom,
                    #b30000,
                    #520000
                );

            box-shadow:
                0 0 10px rgba(255, 0, 0, 0.8),
                0 0 30px rgba(255, 0, 0, 0.4);

            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* =========================
           DISCORD BUTONU
        ========================= */

        .discord-btn {
            display: inline-block;

            padding: 12px 26px;

            background: rgba(10, 10, 20, 0.9);

            border: 1px solid #5865F2;

            border-radius: 6px;

            color: #fff;

            text-decoration: none;

            font-size: 0.9rem;

            font-weight: 800;

            letter-spacing: 1px;

            text-transform: uppercase;

            box-shadow:
                0 0 15px rgba(88, 101, 242, 0.35);

            transition: 0.3s ease;
        }

        .discord-btn:hover {
            background: #5865F2;

            box-shadow:
                0 0 15px rgba(88, 101, 242, 0.8),
                0 0 30px rgba(88, 101, 242, 0.4);

            transform: translateY(-2px);
        }

        /* =========================
           MOBİL
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 25px 14px 35px;
            }

            .site-logo {
                width: 145px;
                margin-bottom: 10px;
            }

            h1 {
                font-size: 2rem;
                letter-spacing: 3px;
            }

            .slogan {
                font-size: 0.8rem;
                letter-spacing: 1px;
                line-height: 1.5;
            }

            .sub-title {
                font-size: 0.75rem;
                letter-spacing: 3px;
            }

            .form-container {
                padding: 22px 18px;
            }

            .form-container h2 {
                font-size: 0.95rem;
            }

            .discord-btn {
                width: 100%;
                max-width: 500px;
            }
        }
    </style>
</head>

<body>

    <!-- ARKA PLAN -->
    <img
        src="arkaplan.png"
        class="bg-fixed-img"
        alt=""
    >

    <div class="overlay"></div>


    <!-- ANA İÇERİK -->
    <main class="container">

        <!-- BAŞLIK -->
        <header class="header-content">

            <!-- LOGO -->
            <img
                src="logo.png"
                class="site-logo"
                alt="Tameria 1337 Logo"
            >

            <h1>TAMERIA 1337</h1>

            <p class="slogan">
                HAKKEDENE HAKKINI VERİCEKSİN S1KER !
            </p>

            <p class="sub-title">
                İNFAZHANE
            </p>

        </header>


        <!-- FORM -->
        <section class="form-container">

            <h2>
                KAYIT &amp; DESTEK TALEBİ
            </h2>

            <form id="ticketForm">

                <div class="form-group">

                    <label for="username">
                        Kullanıcı Adı / Oyun İçi İsim
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="İsminizi girin"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-Posta Adresiniz
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="ornek@gmail.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="discord">
                        Discord Adresiniz
                    </label>

                    <input
                        type="text"
                        id="discord"
                        placeholder="Örn: mortdas1337"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="request">
                        Ne İstiyorsunuz? (Destek / Talebiniz)
                    </label>

                    <textarea
                        id="request"
                        rows="4"
                        placeholder="İsteğinizi veya talebinizi detaylıca yazın..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    💀 TALEBİ GÖNDER 💀
                </button>

            </form>

        </section>


        <!-- DISCORD -->
        <a
            href="https://discord.gg/7naK5EMGFN"
            target="_blank"
            rel="noopener noreferrer"
            class="discord-btn"
        >
            Discord Sunucumuza Katıl
        </a>

    </main>


    <script>

        /*
         * FORM ŞİMDİLİK GÜVENLİK NEDENİYLE
         * WEBHOOK'A BAĞLI DEĞİL.
         *
         * Önce tasarımı çalıştıralım.
         */

        document
            .getElementById("ticketForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                alert(
                    "✅ Talebiniz hazırlandı!\n\n" +
                    "Kullanıcı: " + username
                );

            });

    </script>

</body>
</html>
