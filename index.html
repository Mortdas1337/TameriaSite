<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tameria 1337 | İnfazhane</title>
    <!-- Sekme Logosu (Tarayıcı Sekmesi İçin Favicon) -->
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100%; overflow-x: hidden; background-color: #000; color: #fff; }
        
        /* Arka Plan Görseli - Kesin Çözüm (Sabit ve Tam Ekran) */
        .bg-fixed-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        /* Arka planın üstünü hafifçe karartıp formun okunmasını sağlayan katman */
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.4); 
            z-index: -1; 
        }

        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            min-height: 100vh; 
            text-align: center; 
            padding: 30px 20px; 
            position: relative; 
            z-index: 1; 
        }
        
        /* Üstteki Büyük Başlık ve Slogan */
        .header-content {
            margin-top: 20px;
            margin-bottom: 25px;
        }

        h1 { 
            font-size: 2.8rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            color: #ff2222; 
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 40px rgba(0, 0, 0, 0.9); 
            margin-bottom: 5px; 
        }

        p.slogan { 
            font-size: 1.1rem; 
            color: #ccc; 
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9); 
            font-weight: bold;
        }

        .form-container { 
            background: rgba(12, 12, 12, 0.88); 
            border: 2px solid #ff1a1a; 
            border-radius: 8px; 
            padding: 25px; 
            width: 100%; 
            max-width: 480px; 
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.4); 
            margin-bottom: 20px; 
            backdrop-filter: blur(5px);
        }

        .form-container h2 { 
            font-size: 1.3rem; 
            color: #ff3333; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-align: center;
        }

        .form-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }

        .form-group label { 
            display: block; 
            font-size: 0.8rem; 
            color: #aaa; 
            margin-bottom: 5px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 12px; 
            background: rgba(18, 18, 18, 0.95); 
            border: 1px solid #333; 
            border-radius: 4px; 
            color: #fff; 
            font-size: 0.95rem; 
            outline: none; 
        }

        .form-group input:focus, .form-group textarea:focus { 
            border-color: #ff3333; 
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5); 
        }

        .submit-btn { 
            width: 100%; 
            background: linear-gradient(to bottom, #990000, #4d0000); 
            color: #fff; 
            border: 1px solid #ff1a1a; 
            padding: 14px; 
            font-size: 1rem; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: 0.3s; 
            text-transform: uppercase; 
            margin-top: 10px; 
            letter-spacing: 1px;
        }

        .submit-btn:hover { 
            background: linear-gradient(to bottom, #cc0000, #660000); 
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8); 
        }

        .discord-btn { 
            background: rgba(15, 15, 25, 0.9); 
            color: #fff; 
            text-decoration: none; 
            padding: 12px 25px; 
            font-size: 0.95rem; 
            font-weight: bold; 
            border-radius: 6px; 
            border: 1px solid #5865F2;
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3); 
            transition: 0.3s; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .discord-btn:hover { 
            background: #5865F2; 
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.6);
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <!-- Arka Plan Görseli: Yerel resim engeline takılmaması için doğrudan dosya yoluna bağlandı -->
    <img src="arkaplan.png" class="bg-fixed-img" alt="İnfazhane Arka Plan" onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='">
    <div class="overlay"></div>

    <div class="container">
        <!-- Üst Başlık ve Slogan Geri Getirildi -->
        <div class="header-content">
            <h1>TAMERIA 1337</h1>
            <p class="slogan">HAKKEDENE HAKKINI VERİCEKSİN S1KER !</p>
        </div>

        <div class="form-container">
            <h2>Kayıt & Destek Talebi</h2>
            <form id="ticketForm" onsubmit="sendToDiscord(event)">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı / Oyun İçi İsim</label>
                    <input type="text" id="username" placeholder="İsminizi girin" required>
                </div>
                <div class="form-group">
                    <label for="email">E-Posta Adresiniz</label>
                    <input type="email" id="email" placeholder="ornek@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="discord">Discord Adresiniz</label>
                    <input type="text" id="discord" placeholder="Örn: mortdas1337" required>
                </div>
                <div class="form-group">
                    <label for="request">Ne İstiyorsunuz? (Destek / Talebiniz)</label>
                    <textarea id="request" rows="3" placeholder="İsteğinizi veya talebinizi detaylıca yazın..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Talebi Gönder</button>
            </form>
        </div>

        <a href="https://discord.gg/7naK5EMGFN" target="_blank" class="discord-btn">Discord Sunucumuza Katıl</a>
    </div>

    <script>
        function sendToDiscord(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const discord = document.getElementById('discord').value;
            const request = document.getElementById('request').value;

            const webhookURL = "https://discord.com/api/webhooks/1541361852607369276/Fduk90-hBnW8N2fs4LlAZbgJrjoONq0pXkqmNU1eimxYyOkpv-5E9D27weIDahdLRpkh";

            const payload = {
                content: "🚨 **YENİ KAYIT / DESTEK TALEBİ GELDİ!** 🚨",
                embeds: [{
                    title: "Tameria 1337 İnfazhane Formu",
                    color: 16711680,
                    fields: [
                        { name: "Kullanıcı Adı", value: username, inline: true },
                        { name: "E-Posta", value: email, inline: true },
                        { name: "Discord", value: discord, inline: true },
                        { name: "Talep / İstek", value: request }
                    ],
                    footer: { text: "Tameria 1337 İnfazhane Sistemi" }
                }]
            };

            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                if (response.ok) {
                    alert('✅ Talebiniz başarıyla Discord sunucusuna iletildi!');
                    document.getElementById('ticketForm').reset();
                } else {
                    alert('❌ Bir hata oluştu, tekrar dene.');
                }
            }).catch(error => {
                alert('❌ Bağlantı hatası!');
            });
        }
    </script>
</body>
</html>
