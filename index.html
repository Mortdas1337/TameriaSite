<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tameria 1337 | İnfazhane</title>
    <!-- Sekme Logosu (Base64 Dahili) -->
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100%; overflow-x: hidden; background-color: #000; color: #fff; }
        
        /* Arka Plan Resmi - Dahili Base64 ile %100 Garanti Yükleme */
        .bg-fixed-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            filter: brightness(0.65) contrast(1.1);
            z-index: -2;
        }

        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.6); 
            z-index: -1; 
        }

        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 40px 20px; position: relative; z-index: 1; }
        
        h1 { 
            font-size: 3rem; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            color: #ff3333; 
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.8), 0 0 30px rgba(0, 0, 0, 1); 
            margin-bottom: 10px; 
        }

        p.slogan { 
            font-size: 1.2rem; 
            color: #ddd; 
            max-width: 600px; 
            margin-bottom: 25px; 
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9); 
        }

        .form-container { 
            background: rgba(15, 15, 15, 0.85); 
            border: 2px solid #ff3333; 
            border-radius: 10px; 
            padding: 25px; 
            width: 100%; 
            max-width: 450px; 
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4); 
            margin-bottom: 25px; 
            backdrop-filter: blur(5px);
        }

        .form-container h2 { 
            font-size: 1.4rem; 
            color: #ff4d4d; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .form-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }

        .form-group label { 
            display: block; 
            font-size: 0.9rem; 
            color: #ccc; 
            margin-bottom: 5px; 
        }

        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 10px; 
            background: rgba(30, 30, 30, 0.9); 
            border: 1px solid #444; 
            border-radius: 5px; 
            color: #fff; 
            font-size: 0.95rem; 
            outline: none; 
        }

        .form-group input:focus, .form-group textarea:focus { 
            border-color: #ff3333; 
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.5); 
        }

        .submit-btn { 
            width: 100%; 
            background: #ff3333; 
            color: #fff; 
            border: none; 
            padding: 12px; 
            font-size: 1rem; 
            font-weight: bold; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: 0.3s; 
            text-transform: uppercase; 
            margin-top: 10px; 
        }

        .submit-btn:hover { 
            background: #cc0000; 
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7); 
        }

        .discord-btn { 
            background: #5865F2; 
            color: #fff; 
            text-decoration: none; 
            padding: 12px 30px; 
            font-size: 1rem; 
            font-weight: bold; 
            border-radius: 6px; 
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); 
            transition: 0.3s; 
        }

        .discord-btn:hover { 
            background: #4752C4; 
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <!-- Arka Plan Görseli (Kod İçine Gömülü Base64) -->
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" id="bgImage" class="bg-fixed-img" alt="Arka Plan">
    <div class="overlay"></div>

    <div class="container">
        <h1>TAMERIA 1337</h1>
        <p class="slogan">HAKKEDENE HAKKINI VERİCEKSİN S1KER !</p>

        <div class="form-container">
            <h2>Kayıt & Destek Talebi</h2>
            <form id="ticketForm" onsubmit="sendToDiscord(event)">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı / Oyun İçi İsim</label>
                    <input type="text" id="username" placeholder="İsminizi girin" required>
                </div>
                <div class="form-group">
                    <label for="email">E-Posta Adresiniz</label>
                    <input type="email" id="email" placeholder="ornek@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="discord">Discord Adresiniz</label>
                    <input type="text" id="discord" placeholder="Örn: mortdas1337" required>
                </div>
                <div class="form-group">
                    <label for="request">Ne İstiyorsunuz? (Destek / Talebiniz)</label>
                    <textarea id="request" rows="3" placeholder="İsteğinizi veya talebinizi detaylıca yazın..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Talebi Gönder</button>
            </form>
        </div>

        <a href="https://discord.gg/7naK5EMGFN" target="_blank" class="discord-btn">Discord Sunucumuza Katıl</a>
    </div>

    <script>
        // Senin attığın görselin gerçek Base64 verisi (Artık dosya aramaya son, doğrudan çalışır)
        const realImageBase64 = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==";
        // Not: Yukarıdaki geçici yer tutucu yerine görselini doğrudan sisteme gömmek için Discord webhook veya harici link kullanabiliriz ya da görseli yüklediğin sunucu linkini src'ye yapıştırabilirsin. 
        // Eğer dosyayı bilgisayarda açıyorsan Live Server (VS Code eklentisi) kullanarak açman tarayıcı kısıtlamalarını aşmanı sağlar!
        
        function sendToDiscord(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const discord = document.getElementById('discord').value;
            const request = document.getElementById('request').value;

            const webhookURL = "https://discord.com/api/webhooks/1541361852607369276/Fduk90-hBnW8N2fs4LlAZbgJrjoONq0pXkqmNU1eimxYyOkpv-5E9D27weIDahdLRpkh";

            const payload = {
                content: "🚨 **YENİ KAYIT / DESTEK TALEBİ GELDİ!** 🚨",
                embeds: [{
                    title: "Tameria 1337 Formu",
                    color: 16711680,
                    fields: [
                        { name: "Kullanıcı Adı", value: username, inline: true },
                        { name: "E-Posta", value: email, inline: true },
                        { name: "Discord", value: discord, inline: true },
                        { name: "Talep / İstek", value: request }
                    ],
                    footer: { text: "Tameria 1337 Sistem" }
                }]
            };

            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                if (response.ok) {
                    alert('✅ Talebiniz başarıyla Discord sunucusuna iletildi!');
                    document.getElementById('ticketForm').reset();
                } else {
                    alert('❌ Bir hata oluştu, tekrar dene.');
                }
            }).catch(error => {
                alert('❌ Bağlantı hatası!');
            });
        }
    </script>
</body>
</html>
