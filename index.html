<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tameria 1337 | İnfazhane</title>
    <!-- Sekme Logosu -->
    <link rel="icon" type="image/png" href="arkaplan.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100%; overflow-x: hidden; background-color: #000; color: #fff; }
        
        /* Arka Plan Görseli */
        .bg-fixed-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.2); 
            z-index: -1; 
        }

        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            min-height: 100vh; 
            text-align: center; 
            padding: 40px 20px; 
            position: relative; 
            z-index: 1; 
        }
        
        .header-content {
            margin-top: 10px;
        }

        h1 { 
            font-size: 3.2rem; 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            color: #ff1a1a; 
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.9), 0 0 60px rgba(0, 0, 0, 0.9); 
            font-weight: 900;
            margin-bottom: 5px;
        }

        p.slogan { 
            font-size: 1.15rem; 
            color: #ddd; 
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95); 
            font-weight: 700;
            margin-bottom: 5px;
        }

        p.sub-title {
            font-size: 0.95rem;
            color: #ff3333;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        }

        /* Discord Butonu En Altta Şık Dursun Diye */
        .discord-btn { 
            background: rgba(15, 15, 25, 0.85); 
            color: #fff; 
            text-decoration: none; 
            padding: 12px 35px; 
            font-size: 0.95rem; 
            font-weight: bold; 
            border-radius: 6px; 
            border: 1px solid #5865F2;
            display: inline-block; 
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4); 
            transition: all 0.3s ease; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px; 
        }

        .discord-btn:hover { 
            background: #5865F2; 
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.8);
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <!-- Arka Plan Resmi -->
    <img src="arkaplan.png" class="bg-fixed-img" alt="İnfazhane Arka Plan">
    <div class="overlay"></div>

    <div class="container">
        <!-- Üst Başlık ve Slogan -->
        <div class="header-content">
            <h1>TAMERIA 1337</h1>
            <p class="slogan">HAKKEDENE HAKKINI VERİCEKSİN S1KER !</p>
            <p class="sub-title">İNFAZHANE</p>
        </div>

        <!-- Boş Form Kutusu Kaldırıldı, Sadece Discord Butonu Kaldı -->
        <div>
            <a href="https://discord.gg/7naK5EMGFN" target="_blank" class="discord-btn">Discord Sunucumuza Katıl</a>
        </div>
    </div>

</body>
</html>
