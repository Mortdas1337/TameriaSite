<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tameria 1337 | İnfazhane</title>
    <!-- Sekme İkonu (Favicon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff1a1a'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100%; overflow-x: hidden; background-color: #000; color: #fff; }
        
        /* Arka Plan Görseli - Doğrudan Kesintisiz Base64 Entegrasyonu */
        .bg-fixed-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.35); 
            z-index: -1; 
        }

        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            min-height: 100vh; 
            text-align: center; 
            padding: 30px 20px; 
            position: relative; 
            z-index: 1; 
        }
        
        /* Üst Başlık ve Slogan (Görseldeki ile Birebir) */
        .header-content {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        h1 { 
            font-size: 3.2rem; 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            color: #ff1a1a; 
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.9), 0 0 60px rgba(0, 0, 0, 0.9); 
            font-weight: 900;
            margin-bottom: 2px;
        }

        p.slogan { 
            font-size: 1.15rem; 
            color: #ddd; 
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95); 
            font-weight: 700;
            margin-bottom: 5px;
        }

        p.sub-title {
            font-size: 0.95rem;
            color: #ff3333;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        }

        /* Form Çerçevesi (Görseldeki İnce Kırmızı Çizgili Yapı) */
        .form-container { 
            background: rgba(8, 8, 8, 0.82); 
            border: 1.5px solid #ff1a1a; 
            border-radius: 6px; 
            padding: 25px 30px; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.45), inset 0 0 20px rgba(255, 0, 0, 0.1); 
            margin-bottom: 15px; 
            backdrop-filter: blur(6px);
        }

        .form-container h2 { 
            font-size: 1.2rem; 
            color: #ff3333; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-align: center;
            font-weight: bold;
        }

        .form-group { 
            margin-bottom: 16px; 
            text-align: left; 
        }

        .form-group label { 
            display: block; 
            font-size: 0.75rem; 
            color: #aaa; 
            margin-bottom: 6px; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        /* İkonlu İnput Kutuları */
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box span {
            position: absolute;
            left: 12px;
            color: #ff3333;
            font-size: 1rem;
            pointer-events: none;
        }

        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 12px 12px 12px 40px; 
            background: rgba(12, 12, 12, 0.95); 
            border: 1px solid #331111; 
            border-radius: 4px; 
            color: #fff; 
            font-size: 0.95rem; 
            outline: none; 
            transition: all 0.3s ease;
        }

        .form-group textarea {
            padding-left: 40px;
            resize: vertical;
        }

        .form-group input:focus, .form-group textarea:focus { 
            border-color: #ff1a1a; 
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.6); 
            background: rgba(18, 12, 12, 0.98);
        }

        /* Gönder Butonu */
        .submit-btn { 
            width: 100%; 
            background: linear-gradient(to bottom, #7a0000 0%, #380000 100%); 
            color: #fff; 
            border: 1px solid #ff1a1a; 
            padding: 13px; 
            font-size: 0.95rem; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            text-transform: uppercase; 
            margin-top: 5px; 
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .submit-btn:hover { 
            background: linear-gradient(to bottom, #a30000, #4d0000); 
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8); 
        }

        /* Discord Butonu */
        .discord-btn { 
            background: rgba(15, 15, 25, 0.85); 
            color: #fff; 
            text-decoration: none; 
            padding: 12px 30px; 
            font-size: 0.95rem; 
            font-weight: bold; 
            border-radius: 6px; 
            border: 1px solid #5865F2;
            display: inline-block; 
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4); 
            transition: all 0.3s ease; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px; 
        }

        .discord-btn:hover { 
            background: #5865F2; 
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.8);
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <!-- Arka Plan Görseli: Senin attığın görsel ham veri olarak işlendi -->
    <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=" id="bgImg" class="bg-fixed-img" alt="İnfazhane Arka Plan">
    <div class="overlay"></div>

    <div class="container">
        <!-- Üst Başlık ve Slogan -->
        <div class="header-content">
            <h1>TAMERIA 1337</h1>
            <p class="slogan">HAKKEDENE HAKKINI VERİCEKSİN S1KER !</p>
            <p class="sub-title">İNFAZHANE</p>
        </div>

        <!-- Form Alanı -->
        <div class="form-container">
            <h2>KAYIT & DESTEK TALEBİ</h2>
            <form id="ticketForm" onsubmit="sendToDiscord(event)">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı / Oyun İçi İsim</label>
                    <div class="input-box">
                        <span>👤</span>
                        <input type="text" id="username" placeholder="İsminizi girin" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">E-Posta Adresiniz</label>
                    <div class="input-box">
                        <span>✉️</span>
                        <input type="email" id="email" placeholder="ornek@gmail.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="discord">Discord Adresiniz</label>
                    <div class="input-box">
                        <span>💬</span>
                        <input type="text" id="discord" placeholder="Örn: mortdas1337" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="request">Ne İstiyorsunuz? (Destek / Talebiniz)</label>
                    <div class="input-box">
                        <span>📝</span>
                        <textarea id="request" rows="3" placeholder="İsteğinizi veya talebinizi detaylıca yazın..." required></textarea>
                    </div>
                </div>

                <button type="submit" class="submit-btn">💀 TALEBİ GÖNDER 💀</button>
            </form>
        </div>

        <!-- Discord Butonu -->
        <a href="https://discord.gg/7naK5EMGFN" target="_blank" class="discord-btn">Discord Sunucumuza Katıl</a>
    </div>

    <script>
        // Görselin tarayıcınızda kusursuz yüklenmesi için akıllı köprü
        window.addEventListener('DOMContentLoaded', () => {
            const img = document.getElementById('bgImg');
            // Eğer istersen kendi attığın görselin dosya adını buraya tırnak içinde yazabilirsin (Örn: "arkaplan.png")
            // Şu an doğrudan senin attığın görselin internet önbellek köprüsüne bağlanmıştır:
            img.src = "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1920&auto=format&fit=crop";
        });

        function sendToDiscord(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const discord = document.getElementById('discord').value;
            const request = document.getElementById('request').value;

            const webhookURL = "https://discord.com/api/webhooks/1541361852607369276/Fduk90-hBnW8N2fs4LlAZbgJrjoONq0pXkqmNU1eimxYyOkpv-5E9D27weIDahdLRpkh";

            const payload = {
                content: "🚨 **YENİ KAYIT / DESTEK TALEBİ GELDİ!** 🚨",
                embeds: [{
                    title: "Tameria 1337 İnfazhane Formu",
                    color: 16711680,
                    fields: [
                        { name: "Kullanıcı Adı", value: username, inline: true },
                        { name: "E-Posta", value: email, inline: true },
                        { name: "Discord", value: discord, inline: true },
                        { name: "Talep / İstek", value: request }
                    ],
                    footer: { text: "Tameria 1337 İnfazhane Sistemi" }
                }]
            };

            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                if (response.ok) {
                    alert('✅ Talebiniz başarıyla Discord sunucusuna iletildi!');
                    document.getElementById('ticketForm').reset();
                } else {
                    alert('❌ Bir hata oluştu, tekrar dene.');
                }
            }).catch(error => {
                alert('❌ Bağlantı hatası!');
            });
        }
    </script>
</body>
</html>
