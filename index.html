<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tameria 1337 | İnfazhane</title>
    <!-- Sekme Logosu -->
 <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100%; overflow-x: hidden; background-color: #000; color: #fff; }
        
        /* Arka Plan Görseli - Doğrudan GitHub Deponuzdaki Dosyayı Çeker */
        .bg-fixed-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.25); 
            z-index: -1; 
        }

        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            min-height: 100vh; 
            text-align: center; 
            padding: 25px 20px; 
            position: relative; 
            z-index: 1; 
        }
        
        /* Üst Başlık ve Slogan (Görselinizdekiyle Birebir) */
        .header-content {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        h1 { 
            font-size: 3rem; 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            color: #ff1a1a; 
            text-shadow: 0 0 25px rgba(255, 0, 0, 0.9), 0 0 50px rgba(0, 0, 0, 0.9); 
            font-weight: 900;
            margin-bottom: 2px;
        }

        p.slogan { 
            font-size: 1.1rem; 
            color: #ddd; 
            letter-spacing: 2px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95); 
            font-weight: 700;
            margin-bottom: 4px;
        }

        p.sub-title {
            font-size: 0.9rem;
            color: #ff3333;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        }

        /* Form Çerçevesi (Görseldeki İnce Kırmızı Çizgili Yapı) */
        .form-container { 
            background: rgba(10, 10, 10, 0.78); 
            border: 1.5px solid #ff1a1a; 
            border-radius: 6px; 
            padding: 25px 30px; 
            width: 100%; 
            max-width: 480px; 
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.4), inset 0 0 15px rgba(255, 0, 0, 0.1); 
            margin-bottom: 15px; 
            backdrop-filter: blur(5px);
        }

        .form-container h2 { 
            font-size: 1.15rem; 
            color: #ff3333; 
            margin-bottom: 18px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-align: center;
            font-weight: bold;
        }

        .form-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }

        .form-group label { 
            display: block; 
            font-size: 0.75rem; 
            color: #aaa; 
            margin-bottom: 5px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 11px 12px; 
            background: rgba(12, 12, 12, 0.92); 
            border: 1px solid #331111; 
            border-radius: 4px; 
            color: #fff; 
            font-size: 0.9rem; 
            outline: none; 
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus { 
            border-color: #ff1a1a; 
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.6); 
            background: rgba(18, 12, 12, 0.98);
        }

        .submit-btn { 
            width: 100%; 
            background: linear-gradient(to bottom, #800000 0%, #3a0000 100%); 
            color: #fff; 
            border: 1px solid #ff1a1a; 
            padding: 12px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            text-transform: uppercase; 
            margin-top: 5px; 
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .submit-btn:hover { 
            background: linear-gradient(to bottom, #b30000, #520000); 
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8); 
        }

        .discord-btn { 
            background: rgba(15, 15, 25, 0.85); 
            color: #fff; 
            text-decoration: none; 
            padding: 11px 25px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            border-radius: 6px; 
            border: 1px solid #5865F2;
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); 
            transition: all 0.3s ease; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px; 
        }

        .discord-btn:hover { 
            background: #5865F2; 
            box-shadow: 0 0 25px rgba(88, 101, 242, 0.8);
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <!-- Arka Plan Resmi -->
    <img src="arkaplan.png" class="bg-fixed-img" alt="İnfazhane Arka Plan">
    <div class="overlay"></div>

    <div class="container">
        <!-- Üst Başlık ve Slogan -->
        <div class="header-content">
            <h1>TAMERIA 1337</h1>
            <p class="slogan">HAKKEDENE HAKKINI VERİCEKSİN S1KER !</p>
            <p class="sub-title">İNFAZHANE</p>
        </div>

        <!-- Form Alanı -->
        <div class="form-container">
            <h2>KAYIT & DESTEK TALEBİ</h2>
            <form id="ticketForm" onsubmit="sendToDiscord(event)">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı / Oyun İçi İsim</label>
                    <input type="text" id="username" placeholder="İsminizi girin" required>
                </div>
                <div class="form-group">
                    <label for="email">E-Posta Adresiniz</label>
                    <input type="email" id="email" placeholder="ornek@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="discord">Discord Adresiniz</label>
                    <input type="text" id="discord" placeholder="Örn: mortdas1337" required>
                </div>
                <div class="form-group">
                    <label for="request">Ne İstiyorsunuz? (Destek / Talebiniz)</label>
                    <textarea id="request" rows="3" placeholder="İsteğinizi veya talebinizi detaylıca yazın..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">💀 TALEBİ GÖNDER 💀</button>
            </form>
        </div>

        <!-- Discord Butonu -->
        <a href="https://discord.gg/7naK5EMGFN" target="_blank" class="discord-btn">Discord Sunucumuza Katıl</a>
    </div>

    <script>
        function sendToDiscord(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const discord = document.getElementById('discord').value;
            const request = document.getElementById('request').value;

            const webhookURL = "https://discord.com/api/webhooks/1541361852607369276/Fduk90-hBnW8N2fs4LlAZbgJrjoONq0pXkqmNU1eimxYyOkpv-5E9D27weIDahdLRpkh";

            const payload = {
                content: "🚨 **YENİ KAYIT / DESTEK TALEBİ GELDİ!** 🚨",
                embeds: [{
                    title: "Tameria 1337 İnfazhane Formu",
                    color: 16711680,
                    fields: [
                        { name: "Kullanıcı Adı", value: username, inline: true },
                        { name: "E-Posta", value: email, inline: true },
                        { name: "Discord", value: discord, inline: true },
                        { name: "Talep / İstek", value: request }
                    ],
                    footer: { text: "Tameria 1337 İnfazhane Sistemi" }
                }]
            };

            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => {
                if (response.ok) {
                    alert('✅ Talebiniz başarıyla Discord sunucusuna iletildi!');
                    document.getElementById('ticketForm').reset();
                } else {
                    alert('❌ Bir hata oluştu, tekrar dene.');
                }
            }).catch(error => {
                alert('❌ Bağlantı hatası!');
            });
        }
    </script>
</body>
</html>
